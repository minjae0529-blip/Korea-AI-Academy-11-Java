    /* Notion Like Theme Styling */
    :root {
      --bg-main: #ffffff;

      --text-primary: #37352f;

      --code-bg: #282c34;

      --bg-hover: #2f2f2f;
      --border-color: #303030;
      --text-primary: #e6e6e6;
      --text-secondary: #9b9a97;
      --callout-bg: #252525;
      --code-bg: #141414;
      --code-text: #d4d4d4;

      background-color: var(--bg-main);
      color: var(--text-primary);

    textarea.code-editor {

      tab-size: 4;
      white-space: pre;

    }

    .notion-toggle summary {
      cursor: pointer;
      list-style: none;
    }
    .notion-toggle summary::-webkit-details-marker {
      display: none;
    }

    }

      document.getElementById(`editor_${qId}`).value = q.starterCode;
      saveUserCode(qId, q.starterCode);
    }

    function selectQuizOption(qId, optIdx) {
      userAnswers[qId] = optIdx;
      localStorage.setItem("java_quiz_answers", JSON.stringify(userAnswers));
    }

    // Validate Code Answer
    function runCodeCheck(qId) {
      const q = findQuestion(qId);
      const code = document.getElementById(`editor_${qId}`).value.trim();
      const feedback = document.getElementById(`feedback_${qId}`);
      feedback.classList.remove("hidden");

      // Heuristic validator based on core keywords of the question
      let isCorrect = false;
      let reason = "";

      if (qId === "q1_1") {
        isCorrect = code.includes("%") && code.includes("2") && code.includes("count++");
        reason = isCorrect ? "짝수 판별식(num % 2 == 0)과 누적 카운트가 정상 작동합니다!" : "num % 2 == 0 판별식과 count++ 로직을 확인하세요.";

        isCorrect = (code.includes("- 1") || code.includes("-1")) && code.includes("seats") && code.includes("true");

      } else if (qId === "q2_1") {
        isCorrect = (code.includes("autoIncrement++") || code.includes("autoIncrement + 1")) && code.includes("memoList.add");
        reason = isCorrect ? "autoIncrement 번호표 부여 및 리스트 저장이 완벽합니다!" : "memo.setId(this.autoIncrement++) 및 리스트 저장을 확인하세요.";
      } else if (qId === "q2_2") {
        isCorrect = code.includes("new MemoRepository") && code.includes("new MemoService") && code.includes("new MemoView");
        reason = isCorrect ? "의존성 주입(DI) 3계층이 올바른 순서로 조립되었습니다!" : "Repo -> Service -> View 조립 생성자를 확인하세요.";

        reason = isCorrect ? "Objects.hash(name, age)를 통한 해시코드 재정의가 완벽합니다!" : "return Objects.hash(name, age); 코드를 확인하세요.";
      } else if (qId === "q9_1") {

        reason = isCorrect ? "차량 ID 대조 및 remove(i) 삭제/반환 로직이 완벽합니다!" : "getId().equals(id) 및 remove(i) 호출을 확인하세요.";

      } else if (qId === "q12_1") {
        isCorrect = code.includes("Node<E> next") && code.includes("E data");
        reason = isCorrect ? "연결 리스트 Node<E> 구조체 선언이 완벽합니다!" : "E data와 Node<E> next 참조 필드 선언을 확인하세요.";
      } else if (qId === "q12_2") {

      } else if (qId === "q12_3") {
        isCorrect = code.includes("addAll") && code.includes("Collections.sort");
        reason = isCorrect ? "리스트 addAll 병합 및 Collections.sort 정렬이 완벽합니다!" : "list1.addAll(list2) 및 Collections.sort(list1)를 확인하세요.";
      } else {
        isCorrect = code.length > 20;
        reason = isCorrect ? "성공적으로 코드가 검증되었습니다!" : "코드를 조금 더 구체적으로 작성해 보세요.";
      }

      setSolvedState(qId, isCorrect, reason);

    // Validate Quiz Choice
    function checkQuizAnswer(qId) {
      const q = findQuestion(qId);
      const selected = userAnswers[qId];
      const feedback = document.getElementById(`feedback_${qId}`);
      feedback.classList.remove("hidden");

      if (selected === undefined || selected === null) {
        feedback.className = "mt-2 text-xs p-2.5 rounded bg-yellow-50 text-yellow-800 dark:bg-yellow-950/40 dark:text-yellow-300";
        feedback.innerHTML = "⚠️ 보기를 먼저 하나 선택해 주세요!";
        return;
      }

      const isCorrect = (selected === q.correctAnswer);
      const reason = isCorrect ? "🎉 정답입니다! 개념을 정확히 이해하셨습니다." : "❌ 오답입니다. 힌트와 해설을 확인해 보세요.";
      setSolvedState(qId, isCorrect, reason);
    }

    // Set Solved State and Update UI
    function setSolvedState(qId, isSolved, msg) {
      solvedStatus[qId] = isSolved;
      localStorage.setItem("java_quiz_solved", JSON.stringify(solvedStatus));

      const feedback = document.getElementById(`feedback_${qId}`);
      if (feedback) {
        feedback.className = `mt-2 text-xs p-2.5 rounded font-medium ${
          isSolved 
            ? "bg-green-50 text-green-800 dark:bg-green-950/50 dark:text-green-300 border border-green-200 dark:border-green-800" 
            : "bg-red-50 text-red-800 dark:bg-red-950/50 dark:text-red-300 border border-red-200 dark:border-red-800"
        }`;
        feedback.innerHTML = `${isSolved ? '✅ [PASS]' : '❌ [FAIL]'} ${msg}`;
      }

      const checkbox = document.getElementById(`check_${qId}`);
      if (checkbox) checkbox.checked = isSolved;

      const badge = document.getElementById(`badge_${qId}`);
      if (badge) {
        badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${
          isSolved ? "bg-green-100 dark:bg-green-950 text-green-700 dark:text-green-300" : "bg-gray-100 dark:bg-gray-800 text-[var(--text-secondary)]"
        }`;
        badge.innerText = isSolved ? "풀이 완료 ✅" : "풀이 전";
      }

      const card = document.getElementById(`card_${qId}`);
      if (card) {
        if (isSolved) {
          card.classList.add("ring-1", "ring-green-500/30", "border-green-500/50");
        } else {
          card.classList.remove("ring-1", "ring-green-500/30", "border-green-500/50");
        }
      }

      updateGlobalProgress();
      renderSidebar();
    }

    function toggleSolvedManual(qId, checked) {
      solvedStatus[qId] = checked;
      localStorage.setItem("java_quiz_solved", JSON.stringify(solvedStatus));
      renderCurrentChapter();
      updateGlobalProgress();
      renderSidebar();
    }

    // Global Progress Update
    function updateGlobalProgress() {
      let total = 0;
      let solved = 0;
      CHAPTERS_DATA.forEach(c => {
        c.questions.forEach(q => {
          total++;
          if (solvedStatus[q.id]) solved++;
        });
      });

      const pct = Math.round((solved / total) * 100);
      document.getElementById("progressPercent").innerText = `${pct}%`;
      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("solvedCount").innerText = solved;
      document.getElementById("totalQuestionsCount").innerText = total;
    }

    // Search Handler
    function handleSearch(keyword) {
      if (!keyword.trim()) {
        renderSidebar();
        return;
      }
      const kw = keyword.toLowerCase();
      const filtered = CHAPTERS_DATA.filter(ch => 
        ch.title.toLowerCase().includes(kw) ||
        ch.number.toLowerCase().includes(kw) ||
        ch.desc.toLowerCase().includes(kw) ||
        ch.sourceFiles.some(f => f.toLowerCase().includes(kw)) ||
        ch.questions.some(q => q.title.toLowerCase().includes(kw) || q.concept.toLowerCase().includes(kw))
      );
      renderSidebar(filtered);
    }

    // Reset Progress
    function resetAllProgress() {
      if (confirm("정말 모든 풀이 기록과 점수를 초기화하시겠습니까?")) {
        localStorage.removeItem("java_quiz_solved");
        localStorage.removeItem("java_quiz_answers");
        solvedStatus = {};
        userAnswers = {};
        renderCurrentChapter();
        renderSidebar();
        updateGlobalProgress();
      }
    }

    // Toggle Sidebar
    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      sb.classList.toggle("-ml-72");
    }

    // Helpers
    function findQuestion(qId) {
      for (const ch of CHAPTERS_DATA) {
        for (const q of ch.questions) {
          if (q.id === qId) return q;
        }
      }
      return null;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyToClipboard(qId) {
      const code = document.getElementById(`editor_${qId}`).value;
      navigator.clipboard.writeText(code);
      alert("코드가 클립보드에 복사되었습니다!");
    }

    function copyAllIntelliJCode() {
      const ch = CHAPTERS_DATA.find(c => c.id === currentChapterId);
      if (!ch) return;
      let text = `// ==========================================\n// ${ch.number}. ${ch.title} 인텔리제이 실습 파일\n// ==========================================\n\n`;
      ch.questions.forEach(q => {
        text += `// [${q.title}] - ${q.concept}\n${q.starterCode}\n\n`;
      });
      navigator.clipboard.writeText(text);
      alert(`[${ch.number}]의 모든 실습 코드가 클립보드에 복사되었습니다! 인텔리제이에 바로 붙여넣어 테스트해보세요.`);
    }
  </script>
</body>
</html>
